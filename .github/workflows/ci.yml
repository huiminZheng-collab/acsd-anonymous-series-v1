name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests (network TSA interop skipped)
        run: python -m unittest
        env:
          ACSD_SKIP_NETWORK: "1"
      - name: Canonical differential tests (Python vs Node)
        run: python design/canonical_diff_runner.py
      - name: CLI smoke
        run: acsd --help
