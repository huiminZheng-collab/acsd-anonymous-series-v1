name: CI

on:
  push:
  pull_request:

jobs:
  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Lean 4.33.1
        run: |
          curl -sSL -o lean.zip https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.zip
          unzip -q lean.zip
          echo "$PWD/lean-4.33.1-linux/bin" >> "$GITHUB_PATH"
      - name: Install Python deps (v1 fixture)
        run: python -m pip install --target artifact/.deps cbor2 cryptography
      - name: Root release manifest
        run: node verify-release-manifest.cjs
      - name: v1 fixture (generate + verify)
        run: |
          cd artifact
          ./run.sh
      - name: v2 release manifest
        run: python v2.0.0/verify_release.py v2.0.0
      - name: v2 unit tests
        run: |
          cd v2.0.0
          python -m unittest -q
      - name: v2 demo + verify
        run: |
          cd v2.0.0
          python generate_demo.py
          python verify_pec.py
      - name: formal-core Lean build
        run: |
          cd formal-core
          lake build
      - name: v2 formal Lean build
        run: |
          cd v2.0.0/formal
          lake build
      - name: Install v3 dependencies
        run: python -m pip install "cryptography>=42"
      - name: v3 release manifest
        run: python v3.2.0-rc1/verify_release.py v3.2.0-rc1
      - name: v3 read-only artifact gate
        run: |
          cd v3.2.0-rc1
          python check.py --artifact
      - name: No dirty tree
        run: git diff --exit-code

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Lean 4.33.1
        run: |
          Invoke-WebRequest -Uri "https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-windows.zip" -OutFile lean.zip
          Expand-Archive -Path lean.zip -DestinationPath .
          Add-Content -Path $env:GITHUB_PATH -Value "$PWD\lean-4.33.1-windows\bin"
      - name: Root release manifest
        run: node verify-release-manifest.cjs
      - name: v2 release manifest
        run: python v2.0.0/verify_release.py v2.0.0
      - name: v2 unit tests
        run: |
          cd v2.0.0
          python -m unittest -q
      - name: v2 demo + verify
        run: |
          cd v2.0.0
          python generate_demo.py
          python verify_pec.py
      - name: v2 formal Lean build
        run: |
          cd v2.0.0/formal
          lake build
      - name: Install v3 dependencies
        run: python -m pip install "cryptography>=42"
      - name: v3 release manifest
        run: python v3.2.0-rc1/verify_release.py v3.2.0-rc1
      - name: v3 read-only artifact gate
        run: |
          cd v3.2.0-rc1
          python check.py --artifact --skip-formal
      - name: No dirty tree
        run: git diff --exit-code
