name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.9'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: python -m pip install -e .
      - name: Read-only engineering gate
        run: python check.py --skip-formal
      - name: Frozen v3 evidence package
        run: python verify_release.py release-v3.0.0
      - name: Installed CLI smoke
        run: acsd --help

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Official Lean action; the project and lean-toolchain live in formal/.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          test: false
          axiom-audit: true
          axiom-audit-root: ACSD
