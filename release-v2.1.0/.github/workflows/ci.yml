name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests (network TSA interop skipped)
        run: python -m unittest
        env:
          ACSD_SKIP_NETWORK: "1"
      - name: Canonical differential tests (Python vs Node)
        run: |
          python design/canonical_diff_runner.py
          python design/canonical_fuzz_runner.py
          python design/benchmark_core.py
      - name: Reproduce inherited v1 fixture
        run: python verify_v1_fixture.py
      - name: Demo and PEC verification
        run: |
          python generate_demo.py
          python verify_pec.py
      - name: Deterministic release rebuild
        run: python build_release.py --check
      - name: Release tree is current
        run: git diff --exit-code -- release-v2.1.0
      - name: Installed CLI smoke
        run: acsd --help

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Official Lean action; the project and lean-toolchain live in formal/.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          test: false
          axiom-audit: true
          axiom-audit-root: ACSD
